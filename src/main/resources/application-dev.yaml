spring:
  datasource:
    url: jdbc:h2:file:./data/testdb
    username: sa
    password:
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2

  jpa:
      hibernate:
        ddl-auto: create-drop

      properties:
        hibernate:
          show_sql: true

server:
  servlet:
    context-path: /api/v1/
